site_name: FreshFlow AI Content Pipeline
site_url: https://karicherlamahesh-hub.github.io/freshflow-ai-content-pipeline/
repo_url: https://github.com/karicherlamahesh-hub/freshflow-ai-content-pipeline

theme:
  name: material

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - How it works: how-it-works.md
  - API call: api-call.md
  - HTTP status codes: http-status-codes.md
  - API basics: api-basics.md
  - API quick start: api-quick-start.md
  - API reference: api-reference.md
  - Rules: rules.md
  - Glossary: glossary.md
  - FAQ: faq.md
  - Changelog: changelog.md

plugins:
  - search
  - callouts
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
